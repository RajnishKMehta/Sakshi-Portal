name: Feature Request
description: Propose a new feature or enhancement for Sakshi Portal
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: [RajnishKMehta]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Sakshi Portal? I'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or features you've considered.
